<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockWise{% endblock %}</title>
    <style>
        :root { --navy:#172033; --blue:#2f66ff; --green:#198754; --red:#d94a61; --line:#e7ebf1; --muted:#697386; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:Arial, sans-serif; background:#f5f7fb; color:#1e293b; }
        .layout { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh; }
        aside { background:var(--navy); color:white; padding:28px 20px; }
        .brand { font-size:22px; font-weight:700; margin-bottom:34px; }
        .brand span { color:#76a0ff; }
        nav a { display:block; color:#cbd5e1; text-decoration:none; padding:12px 14px; border-radius:8px; margin:6px 0; }
        nav a.active, nav a:hover { background:#29344d; color:white; }
        main { min-width:0; padding:28px 36px; }
        header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        h1 { margin:0; font-size:28px; }
        .toolbar { display:flex; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .panel { background:white; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
        .panel form { display:flex; gap:10px; align-items:center; }
        input, textarea, select { width:100%; border:1px solid #d8dee8; border-radius:8px; padding:10px 12px; background:white; font-family:inherit; }
        textarea { min-height:72px; resize:vertical; }
        button { border:0; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:600; }
        .primary { background:var(--blue); color:white; }
        .danger { background:#fff0f2; color:var(--red); }
        table { width:100%; border-collapse:collapse; background:white; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
        th, td { text-align:left; padding:14px; border-bottom:1px solid var(--line); vertical-align:top; }
        th { background:#fafbfc; color:#667085; font-size:12px; text-transform:uppercase; }
        .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .actions form { display:flex; gap:6px; flex-wrap:wrap; }
        .actions input, .actions select { width:auto; min-width:90px; }
        .message { padding:12px 14px; border-radius:8px; margin-bottom:14px; background:#e8f7f0; color:#16724d; }
        .message.error { background:#fff0f2; color:#b72b43; }
        .empty { text-align:center; color:var(--muted); padding:38px; }
        .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:18px; }
        .card { background:white; border:1px solid var(--line); border-radius:12px; padding:18px; }
        .card strong { display:block; font-size:26px; margin-top:8px; }
        .card span { color:var(--muted); }
        .status { padding:5px 8px; border-radius:20px; font-size:12px; font-weight:700; }
        .ok { background:#e8f7f0; color:var(--green); }
        .low { background:#fff0f2; color:var(--red); }
        @media (max-width:850px) {
            .layout { grid-template-columns:1fr; } aside { display:none; } main { padding:20px; }
            .cards { grid-template-columns:1fr; } .toolbar, .panel form { flex-direction:column; align-items:stretch; }
            table { display:block; overflow-x:auto; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="layout">
    <aside>
        <div class="brand">Stock<span>Wise</span></div>
        <nav>
            <a href="/" class="{% if active == 'inventory' %}active{% endif %}">Inventory</a>
            <a href="/categories/" class="{% if active == 'categories' %}active{% endif %}">Categories</a>
            <a href="/products/" class="{% if active == 'products' %}active{% endif %}">Products</a>
            <a href="/suppliers/" class="{% if active == 'suppliers' %}active{% endif %}">Suppliers</a>
            <a href="/billing/" class="{% if active == 'billing' %}active{% endif %}">Billing</a>
            <a href="/accounts/" class="{% if active == 'accounts' %}active{% endif %}">Accounts</a>
            <a href="/admin/">Admin</a>
        </nav>
    </aside>
    <main>
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
